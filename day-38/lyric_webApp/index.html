<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrify</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="container">
      <h1>Lyric Finder</h1>
      <p>Find the lyrics to your favorite songs.</p>
      <form action="" id="lyrics-form">
        <label for="title">Artist Name</label>
        <input type="text" id="artist" placeholder="e.g. One Direction" />
        <label for="Song Title"></label>
        <input type="text" id="title" placeholder="e.g. Night Changes" />
        <button type="submit">Search Lyrics></button>
      </form>
      <section id="lyrics-result">
        <h2>Lyrics Result</h2>
        <pre id="lyrics">Your lyrics will appear here...></pre>
      </section>
    </main>
  </body>
</html>
