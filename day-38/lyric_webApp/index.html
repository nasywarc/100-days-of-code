<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find song lyrics by artist and title." />
    <title>Lyrify</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <pre class="logo" aria-label="Lyrify"> _                  _    __
| |  _   _   _ __  (_)  / _|  _   _
| | | | | | | '__| | | | |_  | | | |
| | | |_| | | |    | | |  _| | |_| |
|_| \___,_| |_|    |_| |_|   \___,_|
    |___/                    |___/</pre>

      <form id="lyrics-form" class="search-form">
        <label for="artist">Artist Name:</label>
        <input
          id="artist"
          name="artist"
          type="text"
          placeholder="e.g. One Direction"
          autocomplete="off"
          autofocus
        />

        <label for="title">Song Title:</label>
        <input
          id="title"
          name="title"
          type="text"
          placeholder="e.g. Night Changes"
          autocomplete="off"
        />

        <div class="controls">
          <button id="search-button" type="submit">Get Lyrics</button>
          <button id="clear-button" type="button">Clear / New Search</button>
          <button id="zoom-out" class="zoom-button" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-in" class="zoom-button" type="button" aria-label="Zoom in">+</button>
        </div>
      </form>

      <section
        id="lyrics-display"
        class="lyrics-display"
        aria-live="polite"
        aria-label="Lyrics result"
        tabindex="0"
      ></section>
    </main>
  </body>
</html>
